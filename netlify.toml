[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # No Content-Security-Policy here: a hand-written script-src 'self' blocks
    # Astro's inline island-hydration scripts. Add one via Astro's built-in CSP
    # (experimental.csp), which emits per-script hashes, rather than by hand.

[[redirects]]
  from = "/ph-events/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true
  host = "eu.i.posthog.com"

[[redirects]]
  from = "/ph-static/*"
  to = "https://eu-assets.i.posthog.com/:splat"
  status = 200
  force = true
  host = "eu-assets.i.posthog.com"
