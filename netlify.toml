[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # PostHog is proxied through same-origin /ph-events and /ph-static, so
    # 'self' covers analytics. Verify against a real deploy before tightening.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[redirects]]
  from = "/ph-events/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true
  host = "eu.i.posthog.com"

[[redirects]]
  from = "/ph-static/*"
  to = "https://eu-assets.i.posthog.com/:splat"
  status = 200
  force = true
  host = "eu-assets.i.posthog.com"
